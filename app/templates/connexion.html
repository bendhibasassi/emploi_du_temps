{% extends "base.html" %}
{% block title %}Connexion administrateur{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="card">
            <div class="card-body">
                <h1 class="h3 mb-3">Connexion administrateur</h1>
                <p class="text-muted">Connectez-vous pour modifier les données de l'application.</p>
                <form method="POST">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
                    <div class="mb-3">
                        <label for="utilisateur" class="form-label">Utilisateur</label>
                        <input id="utilisateur" name="utilisateur" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="mot_de_passe" class="form-label">Mot de passe</label>
                        <div class="input-group">
                            <input type="password" id="mot_de_passe" name="mot_de_passe" class="form-control" required>
                            <button type="button" id="afficher_mot_de_passe" class="btn btn-outline-secondary"
                                    aria-label="Afficher le mot de passe" aria-pressed="false">
                                <i class="fas fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Se connecter</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    const champMotDePasse = document.getElementById('mot_de_passe');
    const boutonAffichage = document.getElementById('afficher_mot_de_passe');
    const iconeAffichage = boutonAffichage.querySelector('i');

    boutonAffichage.addEventListener('click', () => {
        const motDePasseVisible = champMotDePasse.type === 'password';
        champMotDePasse.type = motDePasseVisible ? 'text' : 'password';
        boutonAffichage.setAttribute('aria-pressed', String(motDePasseVisible));
        boutonAffichage.setAttribute(
            'aria-label',
            motDePasseVisible ? 'Masquer le mot de passe' : 'Afficher le mot de passe'
        );
        iconeAffichage.classList.toggle('fa-eye', !motDePasseVisible);
        iconeAffichage.classList.toggle('fa-eye-slash', motDePasseVisible);
    });
</script>
{% endblock %}
