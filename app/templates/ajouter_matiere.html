<!-- app/templates/ajouter_matiere.html -->
{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4><i class="fas fa-plus-circle"></i> Ajouter une matière</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="code_matiere" class="form-label">Code matière <span class="text-danger">*</span></label>
                        <input type="text" name="code_matiere" id="code_matiere" class="form-control"
                               placeholder="DROIT101" required>
                        <div class="form-text">Ex: DROIT101, MATH201, INF301</div>
                    </div>

                    <div class="mb-3">
                        <label for="nom_matiere" class="form-label">Nom <span class="text-danger">*</span></label>
                        <input type="text" name="nom_matiere" id="nom_matiere" class="form-control"
                               placeholder="Introduction au droit" required>
                        <div class="form-text">Ex: Introduction au droit, Algèbre linéaire, Programmation Python</div>
                    </div>

                    <div class="mb-3">
                        <label for="id_niveau" class="form-label">Niveau <span class="text-danger">*</span></label>
                        <select name="id_niveau" id="id_niveau" class="form-select" required>
                            <option value="">Sélectionner un niveau...</option>
                            {% for niveau in niveaux %}
                                <option value="{{ niveau.id_niveau }}">{{ niveau.code_niveau }} — {{ niveau.libelle }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="semestre" class="form-label">Semestre <span class="text-danger">*</span></label>
                        <select name="semestre" id="semestre" class="form-select" required>
                            <option value="">Sélectionner un semestre...</option>
                            {% for semestre in semestres %}
                                <option value="{{ semestre }}">{{ semestre }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Types d'enseignement</label>
                        <div class="form-check">
                            <input type="checkbox" name="avec_cm" id="avec_cm" class="form-check-input" checked>
                            <label for="avec_cm" class="form-check-label">CM</label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" name="avec_td" id="avec_td" class="form-check-input">
                            <label for="avec_td" class="form-check-label">TD</label>
                        </div>
                    </div>

                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i>
                        <strong>Rappel :</strong> Le code matière doit être unique et sera utilisé pour identifier la matière.
                    </div>

                    <button type="submit" class="btn btn-success w-100">
                        <i class="fas fa-save"></i> Ajouter la matière
                    </button>
                </form>
            </div>
        </div>

        <div class="mt-3 text-center">
            <a href="{{ url_for('main.matieres') }}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left"></i> Retour à la liste
            </a>
        </div>
    </div>
</div>
{% endblock %}
