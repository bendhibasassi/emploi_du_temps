{% extends "base.html" %}
{% block title %}Nouvelle année universitaire{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-8 col-lg-6 mx-auto">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="fas fa-calendar-plus me-1"></i> Nouvelle année universitaire</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="libelle" class="form-label">Libellé <span class="text-danger">*</span></label>
                        <input type="text" name="libelle" id="libelle" class="form-control"
                               value="{{ request.form.get('libelle', '') }}" placeholder="2026-2027"
                               pattern="[0-9]{4}-[0-9]{4}" maxlength="9" required>
                        <div class="form-text">Format attendu : YYYY-YYYY.</div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="date_debut" class="form-label">Date de début <span class="text-danger">*</span></label>
                            <input type="date" name="date_debut" id="date_debut" class="form-control"
                                   value="{{ request.form.get('date_debut', '') }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="date_fin" class="form-label">Date de fin <span class="text-danger">*</span></label>
                            <input type="date" name="date_fin" id="date_fin" class="form-control"
                                   value="{{ request.form.get('date_fin', '') }}" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-save me-1"></i> Créer l'année universitaire
                    </button>
                </form>
            </div>
        </div>
        <div class="mt-3 text-center">
            <a href="{{ url_for('main.annees_universitaires') }}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-1"></i> Retour à la liste
            </a>
        </div>
    </div>
</div>
{% endblock %}
